<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>班级抽卡_重置版</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--false" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="载入文字" style="color:#cfe3ff;font-family:'Noto Sans','Microsoft YaHei',sans-serif;font-size:15px;margin-top:12px;text-align:center;"></div>
			<div id="载入文字" style="color:#cfe3ff;font-family:'Noto Sans','Microsoft YaHei',sans-serif;font-size:15px;margin-top:12px;text-align:center;"></div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args": [], "canvasResizePolicy": 2, "emscriptenPoolSize": 8, "ensureCrossOriginIsolationHeaders": true, "executable": "index", "experimentalVK": false, "fileSizes": {"index.wasm": 39514754}, "focusCanvas": true, "gdextensionLibs": [], "godotPoolSize": 4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// ★ 分包列表（由 数据/_scratch/_做网页站.py 生成）
const 分片 = ["index.pck.part0", "index.pck.part1", "index.pck.part2"];
const 包字节 = 74760692;

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const 提示 = document.getElementById('载入文字');

	let 初始化中 = true;
	let 模式 = '';

	function 切模式(m) {
		if (模式 === m || !初始化中) return;
		if (m === 'hidden') { statusOverlay.remove(); 初始化中 = false; return; }
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = m === 'progress' ? 'block' : 'none';
		statusNotice.style.display = m === 'notice' ? 'block' : 'none';
		模式 = m;
	}

	function 报错(err) {
		console.error(err);
		切模式('notice');
		statusNotice.textContent = (err && err.message) ? err.message : String(err);
		初始化中 = false;
	}

	function 写提示(文) { if (提示) 提示.textContent = 文; }

	const 缺 = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (缺.length !== 0) {
		报错('这个浏览器跑不了：缺少 ' + 缺.join('、'));
		return;
	}

	切模式('progress');
	写提示('正在下载游戏（共 ' + (包字节 / 1048576).toFixed(0) + ' MB）…');

	// ① 分片下载 → 拼成一个 Blob
	(async function () {
		let 收到 = 0;
		const 块 = [];
		const 起 = performance.now();
		console.log('[启动] 开始下载 ' + 分片.length + ' 个分片，共 ' + 包字节 + ' 字节');
		for (const 名 of 分片) {
			const 响应 = await fetch(名);
			if (!响应.ok) throw new Error('下载失败：' + 名 + '（HTTP ' + 响应.status + '）');
			const 读 = 响应.body.getReader();
			const 小 = [];
			while (true) {
				const r = await 读.read();
				if (r.done) break;
				小.push(r.value);
				收到 += r.value.length;
				const 秒 = (performance.now() - 起) / 1000;
				const 速 = 秒 > 0.4 ? 收到 / 秒 : 0;
				const 剩 = 速 > 0 ? Math.max(0, (包字节 - 收到) / 速) : 0;
				statusProgress.value = 收到;
				statusProgress.max = 包字节;
				写提示('正在下载游戏 ' + (收到 / 1048576).toFixed(1) + ' / '
					+ (包字节 / 1048576).toFixed(0) + ' MB'
					+ (速 > 0 ? '　约剩 ' + (剩 < 60 ? 剩.toFixed(0) + ' 秒'
						: (剩 / 60).toFixed(1) + ' 分钟') : ''));
			}
			块.push(new Blob(小));
			console.log('[启动] ' + 名 + ' 下载完成');
		}
		写提示('正在解包…');
		const 包 = new Blob(块, { type: 'application/octet-stream' });
		if (包.size !== 包字节) throw new Error('包大小不对：' + 包.size + ' / ' + 包字节);
		const 网址 = URL.createObjectURL(包);
		console.log('[启动] 分片拼好了，共 ' + 包.size + ' 字节');

		// ② 启动引擎：先把包挂到一个**干净**的虚拟文件系统路径上
		写提示('正在启动引擎…');
		await engine.init(GODOT_CONFIG.executable);
		console.log('[启动] 引擎已初始化');
		GODOT_CONFIG.fileSizes[网址] = 包字节;
		await engine.preloadFile(网址, '/index.pck');
		console.log('[启动] 包已挂到 /index.pck');
		await engine.start({ args: ['--main-pack', '/index.pck'] });
		console.log('[启动] 游戏已启动');
		切模式('hidden');
	})().catch(报错);
}());
		</script>
	</body>
</html>
